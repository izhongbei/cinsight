name: publish

# 打 tag（v*）或手动触发时：编译 + 测试 + 打包，然后按配置发布到
#   - Open VSX（需要仓库 Secret: OVSX_PAT）
#   - VS Code Marketplace（需要仓库 Variable: ENABLE_MARKETPLACE=true + 已配置 Trusted Publishing）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # VS Code Marketplace Trusted Publishing (OIDC)
    env:
      # 未配置 Secret 时该值为空，对应的发布步骤会被跳过
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test

      - name: Activation smoke test (mock vscode host)
        run: node test/smoke-activate.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-insight-vsix
          path: code-insight-*.vsix
          if-no-files-found: error

      # ---- Open VSX（Cursor / VS Code forks）----
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@latest publish code-insight-*.vsix -p "$OVSX_PAT" --skip-duplicate

      # ---- VS Code Marketplace（OIDC，无需 PAT）----
      # 前置：marketplace.visualstudio.com/manage 里已有 publisher `cinsight`，
      # 且在该 publisher 的 Trusted Publishing 里创建策略：
      #   Repository owner = izhongbei / Repository = cinsight / Workflow = publish.yml
      #
      # 注意：Marketplace 要求扩展 name 与 displayName 全局唯一。`code-insight` 与
      # `Code Insight` 都已被他人占用/永久保留，因此 Marketplace 构建使用专用元数据：
      #   name        = codeinsight            (ID: cinsight.codeinsight)
      #   displayName = Code Insight for C/C++
      # Open VSX 继续使用 package.json 里的 cinsight.code-insight，两边同一份代码。
      - name: Prepare Marketplace metadata
        if: ${{ vars.ENABLE_MARKETPLACE == 'true' }}
        env:
          MARKETPLACE_NAME: codeinsight
          MARKETPLACE_DISPLAY_NAME: Code Insight for C/C++
        run: |
          npm pkg set name="$MARKETPLACE_NAME"
          npm pkg set displayName="$MARKETPLACE_DISPLAY_NAME"
          echo "Marketplace identity: $(npm pkg get name publisher displayName --json)"

      - name: Package Marketplace VSIX
        if: ${{ vars.ENABLE_MARKETPLACE == 'true' }}
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies

      - name: Upload Marketplace VSIX artifact
        if: ${{ vars.ENABLE_MARKETPLACE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: code-insight-marketplace-vsix
          path: codeinsight-*.vsix
          if-no-files-found: error

      - name: Publish to VS Code Marketplace
        if: ${{ vars.ENABLE_MARKETPLACE == 'true' }}
        run: npx --yes @vscode/vsce@4.1.0 publish --oidc
