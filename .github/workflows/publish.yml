name: publish

# 打 tag（v*）或手动触发时：编译 + 测试 + 打包，然后按配置发布到
#   - Open VSX（需要仓库 Secret: OVSX_PAT）
#   - VS Code Marketplace（需要仓库 Variable: ENABLE_MARKETPLACE=true + 已配置 Trusted Publishing）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # VS Code Marketplace Trusted Publishing (OIDC)
    env:
      # 未配置 Secret 时该值为空，对应的发布步骤会被跳过
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile and run tests
        run: npm test

      - name: Activation smoke test (mock vscode host)
        run: node test/smoke-activate.js

      - name: Package VSIX
        run: npx --yes @vscode/vsce@4.1.0 package --no-dependencies

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-insight-vsix
          path: code-insight-*.vsix
          if-no-files-found: error

      # ---- Open VSX（Cursor / VS Code forks）----
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@latest publish code-insight-*.vsix -p "$OVSX_PAT" --skip-duplicate

      # ---- VS Code Marketplace（OIDC，无需 PAT）----
      # 前置：marketplace.visualstudio.com/manage 里已有 publisher `cinsight`，
      # 且在该 publisher 的 Trusted Publishing 里创建策略：
      #   Repository owner = izhongbei / Repository = cinsight / Workflow = publish.yml
      #
      # 注意：Marketplace 要求扩展 name 与 displayName 全局唯一。`code-insight` 与
      # `Code Insight` 都已被他人占用/永久保留，因此 Marketplace 构建使用专用元数据：
      #   name        = codeinsight            (ID: cinsight.codeinsight)
      #   displayName = Code Insight for C/C++
      # Open VSX 继续使用 package.json 里的 cinsight.code-insight，两边同一份代码。
      # Marketplace 的扩展 name / displayName 都要求全局唯一，且"已删除"的扩展名会被
      # 永久保留（搜索查不到）。这里按候选列表逐个尝试：只有出现名字/显示名冲突时才换
      # 下一个候选，其它错误立即失败，避免把真正的配置问题掩盖掉。
      - name: Publish to VS Code Marketplace
        if: ${{ vars.ENABLE_MARKETPLACE == 'true' }}
        env:
          MARKETPLACE_NAMES: cinsight-navigator code-insight-c cinsight-code-insight codeinsight-x
        run: |
          set -o pipefail
          display_names=("Code Insight C/C++ Navigator" "Code Insight for C/C++ by cinsight")
          for display in "${display_names[@]}"; do
            npm pkg set displayName="$display"
            for name in $MARKETPLACE_NAMES; do
              echo "::group::try marketplace identity: $name / $display"
              npm pkg set name="$name"
              echo "identity: $(npm pkg get name publisher displayName --json | tr -d '\n')"
              if out=$(npx --yes @vscode/vsce@4.1.0 publish --oidc 2>&1); then
                echo "$out"
                echo "PUBLISHED_AS=$name" >> "$GITHUB_STEP_SUMMARY"
                echo "PUBLISHED_DISPLAY_NAME=$display" >> "$GITHUB_STEP_SUMMARY"
                echo "Marketplace ID: cinsight.$name"
                echo "::endgroup::"
                exit 0
              fi
              echo "$out"
              echo "::endgroup::"
              if grep -qiE "display name .* already" <<<"$out"; then
                echo "display name '$display' is taken; trying the next display name"
                break
              fi
              if grep -qiE "already exists in the Marketplace" <<<"$out"; then
                echo "name '$name' is reserved by someone else; trying the next name"
                continue
              fi
              echo "publish failed for a reason other than a name conflict; aborting"
              exit 1
            done
          done
          echo "all candidate identities are taken on the Marketplace; extend MARKETPLACE_NAMES"
          exit 1
